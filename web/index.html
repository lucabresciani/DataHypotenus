<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="datahypotenus - il database personale della tua casa" />
    <title>datahypotenus</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23a2492c'/%3E%3Cpath d='M7 22.5 16 8l9 14.5z' fill='none' stroke='white' stroke-width='2.4' stroke-linejoin='round'/%3E%3C/svg%3E" />
    <script>
      // Il tema risolto va su <html data-theme> PRIMA del primo paint: niente
      // lampo bianco aprendo l'app di sera, e un posto solo da guardare per
      // CSS e componenti, anche quando la preferenza e' "automatico".
      try {
        var saved = localStorage.getItem('dh.theme');
        var resolved =
          saved === 'light' || saved === 'dark'
            ? saved
            : window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light';
        document.documentElement.dataset.theme = resolved;
      } catch (e) {
        document.documentElement.dataset.theme = 'light';
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
